<style>

.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}

.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}.row .m{flex:1;min-width:0}.row .m b,.row .m small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .a{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}

label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}

.hide{display:none!important}

.fab{position:fixed;right:20px;bottom:24px;box-shadow:0 6px 18px rgba(0,0,0,.3);padding:14px 22px;z-index:5}
.empty{padding:26px 10px;text-align:center;color:var(--mu)}
.mi{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--bd);padding:12px 4px;cursor:pointer}.mi:last-child{border:0}.mi b,.mi small{display:block}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cg i,.cg span{display:block;text-align:center;font-size:12px;color:var(--mu)}
.hc{aspect-ratio:1;border:0;border-radius:10px;background:color-mix(in srgb,var(--ex) calc(var(--a)*100%),var(--bd));cursor:pointer;color:var(--tx);font-size:12px}.hc.sel{outline:2px solid var(--ac)}
@media(max-width:800px){.app{display:block}main{padding:16px 16px 110px}
nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;background:var(--card);border-top:1px solid var(--bd);border-radius:24px 24px 0 0;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:4;justify-content:space-around;gap:0}
nav h1{display:none}nav button{flex-direction:column;gap:2px;font-size:12px;flex:1;align-items:center;padding:0}nav .ic{width:58px}
.fab{bottom:calc(84px + env(safe-area-inset-bottom,0px))}.two{grid-template-columns:1fr}h2{font-size:24px}
dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:24px 24px 0 0}}
dialog{position:relative}.dx{position:sticky;top:0;float:right;z-index:2;width:34px;height:34px;border-radius:50%;border:1px solid var(--bd);background:var(--card);cursor:pointer;margin:-6px -6px 0 8px}
.chip{border:1px solid var(--bd);background:none;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}.chip.on{background:var(--t4);color:var(--t4x);border-color:transparent}
.bulk{position:sticky;bottom:96px;background:var(--card);border:1px solid var(--ac);border-radius:18px;padding:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;z-index:3;margin-bottom:10px}.bulk input{flex:1;min-width:100px;width:auto}
.row input[type=checkbox]{width:20px;height:20px;flex:none;padding:0}.tl{border-left:2px solid var(--bd);margin-left:6px;padding-left:16px}.tl .e{position:relative;padding:7px 0;display:flex;gap:8px}.tl .e:before{content:"";position:absolute;left:-23px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--ac)}.tl .e .m{flex:1}
@media print{.dx{display:none}:root:root:root{--bg:#fff;--card:#fff;--tx:#000;--mu:#555;--bd:#ccc;--in:#0a7a62;--ex:#b4361f;--ac:#1c5fd1}nav,.fab,.noprint,.top button{display:none!important}.app{display:block}main{padding:0;max-width:none}.card{break-inside:avoid}}
@media(prefers-reduced-motion:no-preference){.rg circle:nth-child(2){transition:stroke-dasharray .8s ease}}
</style></head><body>
<div class="app"><nav id="nav" aria-label="Main"></nav><main id="main"></main></div>
<button class="btn fab" id="add" aria-label="Add transaction">+ Add</button>
<dialog id="dlg"></dialog>
<script>
const K='lifeledger_v1',$=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}};
let db;if(!ls('ll_enc'))try{db=JSON.parse(ls(K))}catch(e){}
if(!db){db={cur:'₹',accounts:[],cats:[],merchants:[],companies:[],tx:[],rules:[],jobs:[],items:[]};
['Food:Restaurants,Groceries,Food Delivery,Coffee,Snacks','Housing','Transport','Shopping','Travel','Entertainment','Health','Education','Family','Bills','Subscriptions','Work','Taxes','Banking','Gifts','Other'].forEach(s=>{const[n,subs]=s.split(':');db.cats.push({id:uid(),name:n,subs:(subs?subs.split(','):[]).map(x=>({id:uid(),name:x}))})})}
let KEY=null,LOCKED=!!ls('ll_enc'),fails=+ls('ll_fail')||0;
const b64=b=>{let s='';new Uint8Array(b).forEach(c=>s+=String.fromCharCode(c));return btoa(s)},ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pw,salt){const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY,new TextEncoder().encode(JSON.stringify(db)));ls('ll_enc',JSON.stringify({iv:b64(iv),ct:b64(ct)}))}
const save=()=>{if(LOCKED)return;if(KEY)seal();else ls(K,JSON.stringify(db))};
let view=ls('ll_view')||'dash',priv=ls('ll_priv')==='1',q='',ft='all',armed='';
const live=()=>db.tx.filter(t=>!t.del);
const nm=(a,id)=>(a.find(x=>x.id==id)||{}).name||'';
const fmt=n=>priv?db.cur+'••••••':(n<0?'-':'')+db.cur+Math.abs(Math.round(n*100)/100).toLocaleString('en-IN');
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
function bal(a){let b=+a.opening||0;live().forEach(t=>{if((t.type=='income'||t.type=='refund'||t.type=='adjustment')&&t.acc==a.id)b+=t.amt;else if((t.type=='expense'||t.type=='investment')&&t.acc==a.id)b-=t.amt;else if(t.type=='transfer'){if(t.acc==a.id)b-=t.amt;if(t.to==a.id)b+=t.amt}});return b}
const sum=(f)=>live().filter(f).reduce((s,t)=>s+t.amt,0);
function render(){
 $('#add').style.display=LOCKED?'none':'';
 if(LOCKED){$('#nav').innerHTML='';$('#main').innerHTML=lockHtml();lockBind();return}
 const V={prof:['Profile',prof],car:['Career',car],life:['Lifetime',life],tl:['Timeline',tl],ch:['Charts',ch],mng:['Manage lists',mng],gs:['Search',gs],dash:['Home',dash],tx:['Transactions',txs],acc:['Accounts',accs],rep:['Repeats',reps],plan:['Plan',plan],rpt:['Monthly report',rpt],tm:['Time machine',tm],aff:['Can I afford this?',aff],cal:['Spending calendar',cal],more:['Settings',more]};if(!V[view])view='dash';
 $('#nav').innerHTML='<h1>LifeLedger</h1>'+MAIN.map(([k,t])=>`<button class="${k==view?'on':''}" data-v="${k}"><span class="ic">${ico(k)}</span>${t}</button>`).join('')+`<button id="mm" class="${MAIN.some(m=>m[0]==view)?'':'on'}" aria-haspopup="dialog"><span class="ic">${ico('more')}</span>More</button>`;
 $('#nav').querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;ls('ll_view',view);q='';render()});$('#mm').onclick=menu;
 $('#main').innerHTML=`<div class="top"><div style="display:flex;align-items:center;gap:8px">${MAIN.some(m=>m[0]==view)?'':'<button class="btn o s" id="bk" aria-label="Back to home">‹</button>'}<h2>${V[view][0]}</h2></div><div style="display:flex;gap:6px"><button class="btn o s" id="gsb">Search</button><button class="btn o s" id="pv" aria-pressed="${priv}" aria-label="${priv?'Show':'Hide'} amounts">${priv?'Show':'Hide'}</button></div></div>`+V[view][1]();
 $('#pv').onclick=()=>{priv=!priv;ls('ll_priv',priv?'1':'0');render()};const bk=$('#bk');if(bk)bk.onclick=()=>{view='dash';render()};$('#gsb').onclick=()=>{view='gs';render()};
 bind&&bind();bind=null;dueBind()}
let bind=null;
let fl={from:'',to:'',cat:'',acc:'',sort:'dd',lim:100},showF=false,sel=new Set();
const TL={expense:'Expense',income:'Income',transfer:'Transfer',investment:'Investment',refund:'Refund',adjustment:'Adjustment'};
function txs(){
 let l=live().filter(t=>ft=='all'||t.type==ft);
 if(fl.from)l=l.filter(t=>t.date>=fl.from);if(fl.to)l=l.filter(t=>t.date<=fl.to);if(fl.cat)l=l.filter(t=>t.cat==fl.cat);if(fl.acc)l=l.filter(t=>t.acc==fl.acc||t.to==fl.acc);
 if(q){const s=q.toLowerCase();l=l.filter(t=>[t.desc,t.notes,t.itype,nm(db.cats,t.cat),nm(db.merchants,t.mer),nm(db.accounts,t.acc),nm(db.companies,t.co),nm(db.pms,t.pm),(t.tags||[]).map(i=>nm(db.tags,i)).join(' '),t.amt,t.date].join(' ').toLowerCase().includes(s))}
 const S={dd:(a,b)=>(b.date+b.at).localeCompare(a.date+a.at),da:(a,b)=>(a.date+a.at).localeCompare(b.date+b.at),ad:(a,b)=>b.amt-a.amt,aa:(a,b)=>a.amt-b.amt};l.sort(S[fl.sort]);
 const tot=l.length,shown=l.slice(0,fl.lim),nf=[fl.from,fl.to,fl.cat,fl.acc].filter(Boolean).length;
 bind=()=>{
  $('#q').oninput=e=>{q=e.target.value;fl.lim=100;const p=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)};
  $('#ft').onchange=e=>{ft=e.target.value;fl.lim=100;render()};$('#tf').onclick=()=>{showF=!showF;render()};
  if(showF){[['ff','from'],['ft3','to'],['fcat','cat'],['facc','acc'],['fso','sort']].forEach(([i,k])=>$('#'+i).onchange=e=>{fl[k]=e.target.value;fl.lim=100;render()});$('#fcl').onclick=()=>{fl={from:'',to:'',cat:'',acc:'',sort:'dd',lim:100};render()}}
  const m=$('#mr');if(m)m.onclick=()=>{fl.lim+=100;render()};
  document.querySelectorAll('[data-s]').forEach(b=>b.onchange=()=>{b.checked?sel.add(b.dataset.s):sel.delete(b.dataset.s);render()});
  const sa=$('#sa');if(sa)sa.onclick=()=>{shown.forEach(t=>sel.add(t.id));render()};
  document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>form(b.dataset.e));
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{db.tx.find(x=>x.id==b.dataset.d).del=Date.now();sel.delete(b.dataset.d);save();render()});
  if(sel.size){$('#bc').onclick=()=>{const c=ens(db.cats,$('#bcat').value,{subs:[]});if(!c)return $('#bcat').focus();db.tx.forEach(t=>{if(sel.has(t.id)&&!t.del){t.cat=c.id;t.sub=0}});save();sel.clear();render()};
   $('#bt').onclick=()=>{const g=ens(db.tags,$('#btag').value);if(!g)return $('#btag').focus();db.tx.forEach(t=>{if(sel.has(t.id)&&!t.del){t.tags=t.tags||[];if(!t.tags.includes(g.id))t.tags.push(g.id)}});save();sel.clear();render()};
   $('#bd').onclick=()=>{if(armed!='bd'){armed='bd';$('#bd').textContent='Trash '+sel.size+'? Tap again';return}armed='';db.tx.forEach(t=>{if(sel.has(t.id))t.del=Date.now()});save();sel.clear();render()};
   $('#bx').onclick=()=>{sel.clear();render()}}};
 const op=(arr,v)=>arr.map(([k,t])=>`<option value="${k}" ${k==v?'selected':''}>${esc(t)}</option>`).join('');
 const sg=t=>t.type=='income'||t.type=='refund'?'+':t.type=='expense'?'-':t.type=='adjustment'&&t.amt<0?'-':'';
 return `<div class="f"><input id="q" type="search" placeholder="Search transactions…" value="${esc(q)}" aria-label="Search transactions"><select id="ft" aria-label="Type">${op([['all','All types'],...Object.entries(TL)],ft)}</select><button class="btn o" id="tf">Filters${nf?' ('+nf+')':''}</button></div>
 ${showF?`<div class="card"><div class="f"><div style="flex:1"><label for="ff">From</label><input id="ff" type="date" value="${fl.from}"></div><div style="flex:1"><label for="ft3">To</label><input id="ft3" type="date" value="${fl.to}"></div></div><div class="f"><div style="flex:1"><label for="fcat">Category</label><select id="fcat"><option value="">All</option>${op(db.cats.map(c=>[c.id,c.name]),fl.cat)}</select></div><div style="flex:1"><label for="facc">Account</label><select id="facc"><option value="">All</option>${op(db.accounts.map(c=>[c.id,c.name]),fl.acc)}</select></div></div><label for="fso">Sort by</label><select id="fso">${op([['dd','Newest first'],['da','Oldest first'],['ad','Largest amount'],['aa','Smallest amount']],fl.sort)}</select><div class="f" style="margin-top:10px"><button class="btn o s" id="fcl">Clear filters</button></div></div>`:''}
 ${sel.size?`<div class="bulk"><b>${sel.size} selected</b><input id="bcat" list="dl-c" placeholder="Category" aria-label="Category"><button class="btn s" id="bc">Set category</button><input id="btag" placeholder="Tag" aria-label="Tag"><button class="btn s" id="bt">Add tag</button><button class="btn o s" id="bd">Trash</button><button class="btn o s" id="bx">Clear</button>${dl('dl-c',db.cats)}</div>`:''}
 <p class="mu" style="display:flex;justify-content:space-between;align-items:center">${tot} transaction${tot==1?'':'s'}<button class="btn o s" id="sa">Select shown</button></p>
 <div class="card">${shown.length?shown.map(t=>{const tg=(t.tags||[]).map(i=>'#'+nm(db.tags,i)).join(' '),sub=[nm(db.cats,t.cat),nm(db.merchants,t.mer),nm(db.companies,t.co),t.type=='transfer'?nm(db.accounts,t.acc)+' → '+nm(db.accounts,t.to):nm(db.accounts,t.acc),nm(db.pms,t.pm),tg,(t.files||[]).length?'📎':''].filter(Boolean).join(' · ');
 return `<div class="row"><input type="checkbox" data-s="${t.id}" ${sel.has(t.id)?'checked':''} aria-label="Select"><div class="m"><b>${esc(t.desc||nm(db.merchants,t.mer)||nm(db.companies,t.co)||TL[t.type])}</b><small class="mu">${t.date} · ${TL[t.type]}${t.itype?' ('+esc(t.itype)+')':''} · ${esc(sub)}</small></div><div class="a ${t.type=='income'||t.type=='refund'?'in':t.type=='expense'?'ex':''}">${sg(t)}${fmt(t.amt).replace('-','')}</div><button class="btn o s" data-e="${t.id}">Edit</button><button class="btn o s" data-d="${t.id}" aria-label="Move to trash">Trash</button></div>`}).join(''):'<div class="empty">No transactions match. Tap “+ Add” or clear the filters.</div>'}</div>${tot>shown.length?`<button class="btn o" id="mr">Show 100 more (${tot-shown.length} left)</button>`:''}`}
function accs(){
 bind=()=>{$('#na').onclick=()=>accForm();document.querySelectorAll('[data-ae]').forEach(b=>b.onclick=()=>accForm(b.dataset.ae))};
 const act=db.accounts.filter(a=>!a.arch),arc=db.accounts.filter(a=>a.arch);
 const row=a=>`<div class="row"><div class="m"><b>${esc(a.name)}</b><small class="mu">${esc(a.type)}${a.inst?' · '+esc(a.inst):''}${a.l4?' · ••'+esc(a.l4):''}</small></div><div class="a ${bal(a)<0?'ex':''}">${fmt(bal(a))}</div><button class="btn o s" data-ae="${a.id}">Edit</button></div>`;

 add('Jobs',db.jobs.filter(j=>has(j.title,nm(db.companies,j.co))).map(j=>r('job',j.id,j.title+' · '+nm(db.companies,j.co),j.start+' → '+(j.end||'present'))));
 add('Accounts',db.accounts.filter(a=>has(a.name,a.inst)).map(a=>r('acc',a.id,a.name,fmt(bal(a)))));
 add('Merchants',db.merchants.filter(m=>has(m.name)).map(m=>r('mer',m.id,m.name,'See transactions')));
 add('Categories',db.cats.filter(c=>has(c.name)).map(c=>r('cat',c.id,c.name,'See transactions')));
 add('Goals, budgets and holdings',db.items.filter(i=>has(i.name)).map(i=>r('item',i.id,i.name,i.kind+' · '+fmt(i.amt))));
 return G.join('')||'<div class="empty">No matches.</div>'}
